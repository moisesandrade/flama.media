<script>
const canvas = document.getElementById('flame-canvas');
const ctx = canvas.getContext('2d');

let W, H;
let particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor(x) {
    this.reset(x);
  }
  reset(x) {
    this.x = x !== undefined ? x : (W * 0.3 + Math.random() * W * 0.4);
    this.y = H + 10;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.vy = -(1.5 + Math.random() * 3.5);
    this.life = 0;
    this.maxLife = 80 + Math.random() * 120;
    this.size = 2 + Math.random() * 10;
    this.hue = 10 + Math.random() * 40;
  }
  update() {
    this.life++;
    this.x += this.vx + Math.sin(this.life * 0.08) * 0.6;
    this.y += this.vy;
    this.vy -= 0.015;
    this.vx *= 0.993;
    this.size *= 0.985;
    return this.life < this.maxLife && this.size > 0.3;
  }
  draw() {
    const t = this.life / this.maxLife;
    const alpha = t < 0.15 ? t / 0.15 : 1 - ((t - 0.15) / 0.85);
    const lightness = 45 + t * 30;
    ctx.save();
    ctx.globalAlpha = alpha * 0.4;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grad.addColorStop(0, `hsla(${this.hue + 10}, 100%, ${lightness + 15}%, 1)`);
    grad.addColorStop(0.4, `hsla(${this.hue}, 95%, ${lightness}%, 0.8)`);
    grad.addColorStop(1, `hsla(${this.hue - 10}, 80%, 20%, 0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }
}

class Ember {
  constructor() { this.reset(); }
  reset() {
    this.x = W * 0.2 + Math.random() * W * 0.6;
    this.y = H * 0.6 + Math.random() * H * 0.4;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = -(0.5 + Math.random() * 2);
    this.life = 0;
    this.maxLife = 60 + Math.random() * 80;
    this.size = 0.8 + Math.random() * 2;
  }
  update() {
    this.life++;
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.02;
    this.vx += (Math.random() - 0.5) * 0.15;
    return this.life < this.maxLife;
  }
  draw() {
    const t = this.life / this.maxLife;
    const alpha = t < 0.2 ? t / 0.2 : 1 - ((t - 0.2) / 0.8);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${30 + Math.random() * 20}, 100%, 70%)`;
    ctx.fill();
    ctx.restore();
  }
}

let embers = [];

function spawnBatch() {
  const cx = W * 0.25 + Math.random() * W * 0.5;
  const count = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(cx + (Math.random() - 0.5) * 60));
  }
  if (Math.random() < 0.15) embers.push(new Ember());
}

let spawnTimer = 0;
function loop() {
  requestAnimationFrame(loop);
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(10,10,10,0.22)';
  ctx.fillRect(0, 0, W, H);

  spawnTimer++;
  if (spawnTimer % 6 === 0) spawnBatch();

  particles = particles.filter(p => { const alive = p.update(); if (alive) p.draw(); return alive; });
  embers = embers.filter(e => { const alive = e.update(); if (alive) e.draw(); return alive; });

  if (particles.length < 60) {
    for (let i = 0; i < 2; i++) particles.push(new Particle());
  }
}
loop();


</script>
